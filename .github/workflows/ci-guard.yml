name: ci-guard

# CI integrity monitor: it guards the OTHER workflows, so that a green
# `ci-required` means the gate that passes locally actually ran — not a
# workflow quietly weakened to pass. Fails when:
#   1. an external action is not pinned to a full 40-character commit SHA,
#   2. a workflow hides failures with `continue-on-error: true`
#      (escape hatch: annotate the line `# ci-guard:allow`),
#   3. a workflow installs with `npm install` instead of `npm ci`,
#   4. frontend-ci.yml does not invoke the canonical `npm run ci` gate,
#   5. .github/required-checks.txt names a job no workflow defines,
#   6. a script under scripts/ci fails `bash -n` or `shellcheck -x`,
#   7. a Dockerfile FROM is not pinned to an @sha256 digest at the .nvmrc
#      version (scripts/ci/check-image-pins.sh),
#   8. the `ci-required` fan-in or its guards fail their own regression suite,
#   9. the `e2e` browser lane stops driving the built image, disarms its
#      coverage floor, stops uploading artifacts, or stops proving that the
#      harness is absent from the shipped image
#      (scripts/ci/check-e2e-lane.sh).
#
# ADR-002 asks the fan-in guard to reject `continue-on-error` on a required
# lane and to reject an empty test selection. (2) is the first. The second is
# enforced where the tests run: vitest.config.mts sets `passWithNoTests: false`,
# so a run that collected nothing exits non-zero instead of passing.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/required-checks.txt"
      - "scripts/ci/**"
      - "vitest.config.mts"
      - "playwright.config.ts"
      - "e2e/harness/**"
      - "Dockerfile"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/required-checks.txt"
      - "scripts/ci/**"
      - "vitest.config.mts"
      - "playwright.config.ts"
      - "e2e/harness/**"
      - "Dockerfile"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job used to need nothing but bash. `check-e2e-lane.sh` now PARSES
      # the e2e workflow (it used to grep it, and an independent verifier walked
      # three mutations through the grep), and the parser needs the pinned
      # `yaml` package. Without this the guard's own regression suite reported
      # 13 failures of the form "Cannot find package 'yaml'" — loudly, which is
      # the right way for a missing dependency to show up, but it must not be
      # missing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # A workflow file GitHub cannot parse is caught by the fan-in's zero-job
      # guard (scripts/ci/require-checks.sh: a run that concludes failure with
      # zero jobs fails `ci-required` by name), so no YAML linter is duplicated
      # here — and none is installed that could disagree with GitHub's parser.

      - name: scripts/ci is syntax-checked and shellchecked
        run: |
          for f in scripts/ci/*.sh; do
            bash -n "$f"
            shellcheck -x "$f"
          done
          echo "OK: every scripts/ci script parses and passes shellcheck."

      - name: External actions use immutable commit pins
        run: |
          bad=$(
            grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+' .github/workflows \
              | grep -vE 'uses:[[:space:]]+\./' \
              | grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?[[:space:]]*$' || true
          )
          if [ -n "$bad" ]; then
            echo "::error::External actions must be pinned to a full 40-character commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: every external action uses an immutable commit pin."

      - name: No hidden failures (continue-on-error)
        run: |
          bad=$(grep -rnE '^[[:space:]]*continue-on-error:[[:space:]]*true' .github/workflows \
            | grep -v 'ci-guard:allow' || true)
          if [ -n "$bad" ]; then
            echo "::error::continue-on-error: true hides failures:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: no unmarked continue-on-error."

      - name: Workflows install from the lockfile, never `npm install`
        run: |
          bad=$(grep -rnE '^[[:space:]]*(run:|-)?[[:space:]]*npm install' .github/workflows || true)
          if [ -n "$bad" ]; then
            echo "::error::use 'npm ci'; 'npm install' resolves fresh and rewrites the lockfile in the runner:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: every workflow installs with npm ci."

      - name: An empty test selection cannot pass
        run: |
          grep -q 'passWithNoTests: false' vitest.config.mts \
            || { echo "::error::vitest.config.mts must keep passWithNoTests: false — a run that collected nothing is not a pass (AGENTS.md)." >&2; exit 1; }
          echo "OK: a vitest run that collects nothing fails."

      - name: Every required check name is a job some workflow defines
        run: bash scripts/ci/check-required-manifest.sh

      # The manifest defines what `ci-required` waits for, and it lives in the
      # tree the pull request can edit. Nothing asserted that the lanes that
      # matter were still IN it, so deleting one line merged green with no
      # lint, typecheck, test or build ever having to pass. The floor lives in
      # a separate, owner-reviewed file (.github/CODEOWNERS).
      - name: The required-check manifest still demands its floor
        run: bash scripts/ci/check-required-floor.sh

      # Actions are pinned to commit SHAs and the contract to a sha256; the
      # Docker base image was the one input still referenced by a mutable tag,
      # so a registry repoint changed what ships with no diff. The guard also
      # binds the tag to .nvmrc, which is what makes the digest maintainable:
      # a Node bump cannot leave a stale digest behind silently.
      - name: Dockerfile base images are immutably pinned
        run: bash scripts/ci/check-image-pins.sh

      - name: The ci-required fan-in and its guards stay fail-closed
        run: bash scripts/ci/require-checks_test.sh

      # The browser lane's value rests on properties no passing run shows:
      # that it drives the BUILT IMAGE rather than a dev server, that the
      # coverage floor is armed so a run collecting nothing fails, that it
      # publishes traces and the report when it goes red, and that it proves
      # the fault-injection harness is not inside the image it tests.
      - name: The e2e lane still tests what it claims to test
        run: bash scripts/ci/check-e2e-lane.sh

      - name: frontend-ci runs the canonical gate
        run: |
          grep -Eq 'npm run ci' .github/workflows/frontend-ci.yml \
            || { echo "::error::frontend-ci.yml must run the canonical gate ('npm run ci') so CI mirrors local." >&2; exit 1; }
          echo "OK: frontend-ci.yml invokes the canonical gate."
