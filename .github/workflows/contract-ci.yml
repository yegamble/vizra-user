name: contract-ci

# VZ-FOUND-002, this repository's half: the OpenAPI contract is vizra-core's,
# the TypeScript client here is generated from it, and a hand-edited generated
# file is rejected.
#
# WHAT THIS PROVES (no network, no credentials):
#   * contracts/manifest.json is well formed and describes the vendored file
#     truthfully: `source_ref: main`, a full 40-character `source_commit` and
#     `source_blob`, and a sha256, byte count and blob id that match the bytes
#     on disk. PR #1's manifest named a commit on a core feature branch that
#     was later squash-merged and deleted; nothing read that field, so nothing
#     went red. Now something reads it.
#   * contracts/vizra-core/api/openapi.yaml is the file contracts/manifest.json
#     describes (sha256), so the vendored spec cannot be edited here to make a
#     stale client look fresh;
#   * lib/api/generated.ts is byte-for-byte what the pinned openapi-typescript
#     produces from that spec.
#
# WHAT IT DOES NOT PROVE, and why: that the vendored copy is still current with
# vizra-core's `main` — nor even that the recorded commit exists. Vidra's
# equivalent lane checks the backend repo out in the workflow, which works
# because that repo is public; `yegamble/vizra-core` is private, so that step
# needs a read-only token this repository does not have. Providing it is an
# OWNER action outside any pull request; adding the step is owed work
# (AGENTS.md, "Owed"). Until then core's own route↔spec contract test plus
# review of the manifest's `source_commit` are what keep the vendored copy
# honest. This lane is not a substitute for that.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # BEFORE the generator reads the spec. openapi-typescript resolves
      # external `$ref` targets through @redocly/openapi-core, http(s)
      # included, so a pull request that edited the vendored spec (and its
      # manifest sha256 to match, which any contributor can do) would make this
      # lane fetch a host of the author's choosing during codegen and splice an
      # unreviewed schema into a committed artifact. `codegen.mjs` calls the
      # same guard itself, so `npm run codegen` is covered too; it is a step of
      # its own here so the lane shows which input it refused.
      - name: The vendored contract references nothing outside itself
        run: node scripts/check-spec-refs.mjs

      # `npm run check:contract` calls this too, so the drift lane cannot run
      # without it. It is a step of its own for the same reason the $ref guard
      # is: when the manifest is the thing that is wrong, the lane should say
      # so by name rather than inside a longer check.
      - name: The manifest describes the vendored contract
        run: node scripts/check-manifest.mjs

      - name: Generated client matches the contract
        run: npm run check:contract

      # The check above regenerates into a temp directory and never touches the
      # working tree, so a dirty tree here would mean something else wrote to
      # it. Cheap insurance that the check is a comparison, not a fixup.
      - name: The check changed nothing
        run: git diff --exit-code
