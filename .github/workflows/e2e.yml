name: e2e

# The browser lane (VZ-FOUND-008).
#
# WHAT IT DRIVES. The PRODUCTION IMAGE — the same Dockerfile the release
# builds, built here on the acceptance platform (ADR-009: GitHub-hosted
# `ubuntu-24.04`, linux/amd64), started as a container, and driven through
# Playwright at 1440 px and 390 px. Not `next dev`, and not `next build` output
# served some other way: `e2e/specs/production-build.spec.ts` asserts five
# independent production markers, so a lane pointed at the wrong server goes
# red instead of quietly testing something else.
#
# WHY NO PATH FILTER. This lane is REQUIRED (`.github/required-checks.txt`,
# and the floor in `scripts/ci/check-required-floor.sh`). A path-filtered
# required lane passes by never running, which is the failure mode
# `ci-required` exists to prevent. It runs on every pull request and every
# merge-queue entry.
#
# COVERAGE. Chromium only, and labelled as such — the VZ-FOUND-008 ledger entry
# requires that WebKit/Safari is not claimed. No accessibility engine yet
# (VZ-A11Y-001, M1) and no visual baselines: approving a baseline is a reviewed
# act of its own and this lane does not take one.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # THE PAGE SNAPSHOT IS OFF IN CI, AND ONLY IN CI.
    #
    # Playwright writes `test-results/**/error-context.md` whenever a test has
    # errors. NO configuration option gates that FILE — not `trace`, not
    # `screenshot`, not `video`; it was still written in a probe with all three
    # set to "off". But one environment variable gates its worst section
    # (`playwright/lib/index.js:657-658`):
    #
    #     async _takePageSnapshot(context) {
    #       if (process.env.PLAYWRIGHT_NO_COPY_PROMPT)
    #         return;
    #
    # `# Page snapshot` is an `ariaSnapshot({ mode: "ai" })` of the LIVE PAGE:
    # every DOM text node and every input's current value. In the probe it is
    # what captured a typed password while every recorder was off. From M1 that
    # page is the product, so the snapshot is the richest private-data channel
    # in anything this lane uploads.
    #
    # Set here and never in `package.json`, so a developer running the lane
    # locally still gets the snapshot on their own machine, where they are
    # allowed to see it. `scripts/ci/check-e2e-lane.mjs` asserts it is set.
    env:
      PLAYWRIGHT_NO_COPY_PROMPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Exactly the browsers the two projects need, at the revision the pinned
      # @playwright/test resolves — `--with-deps` adds the system libraries the
      # runner image does not ship. No Firefox, no WebKit: they are not in the
      # projects and downloading them would be time spent on coverage this lane
      # does not claim.
      - name: Install the pinned Chromium
        run: npm run e2e:install -- --with-deps

      # Printed to the JOB LOG, not to a file: `playwright-browsers.txt` used to be
      # uploaded and was never read by the upload gate (PR #10 VERIFY FINDING 12,
      # sentinel F-1).
      - name: Record the browser revision
        run: |
          set -euo pipefail
          npx playwright --version
          npx playwright install --dry-run chromium

      # The image under test is the one the release builds. `docker-build.yml`
      # proves the Dockerfile builds; this lane proves the thing it produces
      # actually serves a working UI.
      - name: Build the production image (linux/amd64)
        run: docker build --tag vizra-user:e2e .

      # The harness must not be able to reach a fixture route, because none
      # ships. Asserted against the image's own filesystem rather than trusted
      # from .dockerignore.
      - name: The image contains no browser-harness file or fixture
        run: bash scripts/ci/check-no-test-fixtures-in-image.sh vizra-user:e2e

      - name: Start the production image
        run: |
          set -euo pipefail
          docker run --detach --name vizra-user-e2e --publish 3000:3000 \
            --env INTERNAL_API_BASE_URL=http://api.sentinel.invalid:8080 \
            --env PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            vizra-user:e2e
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/health -o /dev/null; then
              echo "the image is serving"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the production image never answered /health"
          docker logs vizra-user-e2e 2>&1 | tail -80
          exit 1

      # The lane. `E2E_BASE_URL` makes the harness drive the container and start
      # no server of its own. The coverage floor in
      # e2e/harness/coverage-reporter.ts is ON by default and is NOT disabled
      # here — a run that collects nothing must fail.
      - name: Browser lane (desktop 1440, mobile 390)
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

      # The floor, re-checked from OUTSIDE the Playwright process. The
      # in-process reporter lives in playwright.config.ts, which the pull
      # request being gated can edit: deleting one line from the `reporter`
      # array removes the floor with no other visible effect. This step reads
      # the finished run's own JSON report and the same
      # e2e/harness/required-projects.json, so the floor survives the deletion
      # of its own enforcer. scripts/ci/check-e2e-lane.sh requires this step to
      # follow the lane step.
      - name: The coverage floor was actually satisfied
        run: node scripts/ci/check-coverage-floor-ran.mjs

      # THE HARNESS'S OWN SELF-TEST, and the one case a green lane cannot show.
      # An independent verifier recorded that neutering e2e/harness/test.ts — or
      # the listeners in e2e/harness/browser-errors.ts — while leaving the
      # identifiers in place is SILENT in CI: `npm run test` exits 0, the lane
      # guard's harness check is string-presence only, and the lane itself exits
      # 0, because a guard that has stopped looking finds nothing to fail on.
      # Only `npm run e2e:demos` would have caught it, and that is not a CI lane.
      #
      # So the three fault-injection fixtures run here, against the container the
      # lane just drove, and each is REQUIRED to fail for its own named reason
      # (console.error / http 404 / pageerror). If any of them passes, this step
      # is red. One browser launch, about three seconds. It is unconditional and
      # does not continue-on-error; scripts/ci/check-e2e-lane.mjs asserts all
      # three of those properties.
      - name: The harness still fails a broken page (canary)
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: node scripts/ci/harness-canary.mjs

      - name: Container logs
        if: always()
        run: docker logs vizra-user-e2e 2>&1 | tail -200 || true

      # THE UPLOAD GATE: ONE ALLOWLISTED TEXT FILE, STAGED BY CONTENT.
      #
      # The repository is PUBLIC (`gh repo view yegamble/vizra-user --json
      # visibility` -> PUBLIC since 2026-09-23), so the artifact below is
      # readable by anyone for its 3 days. This step copies the bytes of exactly
      # one file, `playwright-report/results.json`, into a directory it creates,
      # `e2e-artifacts/`, after redacting URL query strings and checking every
      # rule in AGENTS.md § Artifact privacy ("What the gate refuses, exactly"):
      # a regular file, 8 MiB at most, strict UTF-8, no control byte but TAB and
      # LF, no base64/base64url/hex run longer than 89, JSON, no page or matcher
      # snapshot, no git metadata. Any failure refuses the whole upload.
      #
      # It no longer DETECTS images in whatever Playwright wrote. That version
      # was walked around every round - screencast frames, data URIs, links,
      # nested and unrecognised archives, untyped data URIs, a HAR, and an
      # uploaded file it never read (PR #10 VERIFY FINDINGS 9-12, sentinel
      # F-1/F-2). Traces, `error-context.md` (which can carry a whole-page aria
      # snapshot with typed values: security seat S-1), the HTML report, HARs,
      # screenshots and videos are simply not staged, so they are not uploaded.
      # They stay on the runner; traces and pixels belong to Lane B.
      #
      # THIS STEP IS PINNED BYTE-FOR-BYTE (.github/e2e-pinned-steps.yml). The
      # guard used to recognise it by a substring, so `… || true` or an `echo`
      # left the upload gated on a step that had checked nothing (PR #8,
      # R3-FINDING H). Edit the step and its pin together.
      #
      # The upload is gated on THIS step having SUCCEEDED, not merely on the job
      # having failed: `failure()` is true when any earlier step failed, so with a
      # bare `if: failure()` a gate that exits non-zero would satisfy its own
      # condition and the upload would still run.
      #
      # WHAT THIS DOES NOT COVER (AGENTS.md § Artifact privacy, R-A to R-D): the
      # JOB LOG - the `list` reporter prints the same failure text and every
      # stdout/stderr line verbatim, and no gate reads it; a process the lane
      # left running can write into `e2e-artifacts/` after this step; and a pull
      # request can edit this workflow.
      - name: Stage the one allowlisted artifact file
        id: redact
        if: failure()
        run: bash scripts/ci/redact-artifacts.sh

      # `results.json` only - the failure messages, received values, titles,
      # stdout/stderr and attachment paths of a red run. Uploaded on failure,
      # and only if the gate above succeeded; if it did not, NOTHING is
      # published, and the job log is what remains.
      #
      # `if-no-files-found: error`: when the gate succeeded there IS a staged
      # file, so its absence is a defect in this workflow, not a quiet warning.
      #
      # THE PATH IS THE STAGING DIRECTORY AND NOTHING ELSE, pinned in
      # .github/e2e-pinned-steps.yml and required by scripts/ci/check-e2e-lane.mjs,
      # which also refuses any other upload of any path in any workflow of this
      # repository but the supply-chain reports (sentinel Q-1).
      # `playwright-report/index.html` in particular carries a base64-embedded
      # ZIP of the whole report dataset that no redactor here can reach.
      #
      # RETENTION IS 3 DAYS. A report nobody downloaded in three days is one
      # nobody needed.
      - name: Upload Playwright artifacts
        if: failure() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/
          retention-days: 3
          if-no-files-found: error

      - name: Stop the container
        if: always()
        run: docker rm --force vizra-user-e2e > /dev/null 2>&1 || true
